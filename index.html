<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Perspective</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            .sky {
                height: 100vh;
                position: relative;
                background-color: #081125;
            }

            .mountains {
                background-image: url(img/mountains.png);
                height: 316px;
                width: 100vw;
                top: calc(50% - 316px);
                position: absolute;
            }

            .ground {
                display: flex;
                width: 200vw;
                height: 100vh;
                position: absolute;
                z-index: 2;
                bottom: 0;
                left: -50%;
            }

            .gras {
                width: 45%;
                background-color: #032903;
                transform: rotateX(70deg);
            }

            .road {
                width: 10%;
                background-color: gray;
                transform: rotateX(70deg);
            }

            .ground {
                perspective: 300px;
                -webkit-perspective: 300px;
                -webkit-backface-visibility: visible;
                transform-style: preserve-3d;
                -webkit-transform-style: preserve-3d;
                perspective-origin: 50% 50%;
                -webkit-perspective-origin: 50% 50%;
            }

            .markup {
                width: 50%;
                height: 100%;
                margin-left: calc(50% - 5px);
                border-left: 10px dashed #e0e0e0;
            }

            .perspective {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                position: relative;
            }

            .star {
                border-radius: 50%;
                position: absolute;
            }

            .star-1 {
                top: 10vh;
                left: 2vw;
                box-shadow: 0px 8px 6px 4px yellow;
            }

            .star-2 {
                top: 20vh;
                left: 25vw;
                box-shadow: 0px 8px 4px 4px yellow;
            }

            .star-3 {
                top: 8vh;
                left: 50vw;
                box-shadow: 0px 8px 15px 4px yellow;
            }

            .star-4 {
                top: 13vh;
                left: 75vw;
                box-shadow: 0px 8px 10px 4px yellow;
            }

            .star-5 {
                top: 12vh;
                left: 95vw;
                box-shadow: 0px 8px 20px 4px yellow;
            }

            .ghost-wrap {
                position: absolute;
                left: calc(50% - 7.5vw);
                bottom: 5vh;
                z-index: 3;
                animation: ghostCome 10s linear 1;
            }


        </style>
    </head>

    <body>
        <div class="perspective">
            <div class="sky">
                <div class="star star-1"></div>
                <div class="star star-2"></div>
                <div class="star star-3"></div>
                <div class="star star-4"></div>
                <div class="star star-5"></div>
            </div>
            <div class="mountains">
            </div>
            <div class="ground">
                <div class="gras"></div>
                <div class="road">
                    <div class="markup"></div>
                </div>
                <div class="gras"></div>
            </div>
           
        </div>
    </body>

</html>
